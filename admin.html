<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - DEINSA</title>
  <style>
    /* Styling Dashboard Admin */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    
    /* Form & Input */
    form div { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus { border-color: #3498db; outline: none; }
    
    /* Tombol */
    button { padding: 10px 18px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #2980b9; }
    button.logout-btn { background: #e74c3c; float: right; margin-top: -10px; }
    button.logout-btn:hover { background: #c0392b; }
    button.btn-edit { background: #f39c12; margin-right: 5px; }
    button.btn-edit:hover { background: #d68910; }
    button.btn-hapus { background: #e74c3c; }
    button.btn-hapus:hover { background: #c0392b; }
    
    /* Tabel */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { border: 1px solid #ecf0f1; padding: 12px; text-align: left; }
    th { background-color: #2c3e50; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    hr { border: 0; height: 1px; background: #eee; margin: 25px 0; }
    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full-width { grid-column: span 2; }
  </style>
</head>
<body>

<div class="container">

  <div id="section-login">
    <h2 style="text-align: center; color: #2c3e50;">Login Admin DEINSA</h2>
    <form id="form-login" onsubmit="prosesLogin(event)" style="max-width: 400px; margin: 0 auto;">
      <div>
        <label for="input-pin">Masukkan PIN Keamanan:</label>
        <input type="password" id="input-pin" required placeholder="Ketik PIN Anda di sini...">
      </div>
      <button type="submit" style="width: 100%;">Masuk ke Dashboard</button>
    </form>
  </div>

  <div id="section-dashboard" class="hidden">
    <button class="logout-btn" onclick="prosesLogout()">Keluar</button>
    <h2>Kelola Produk DEINSA</h2>
    <hr>

    <h3><span style="color:#2c3e50;">+</span> Tambah Produk Baru</h3>
    <form id="form-tambah-produk" onsubmit="tambahProduk(event)" class="grid-form">
      <div>
        <label>ID Produk (Kode Unik):</label>
        <input type="text" id="idProduk" placeholder="Contoh: DSN-004" required>
      </div>
      <div>
        <label>Nama Pakaian:</label>
        <input type="text" id="namaProduk" placeholder="Contoh: Kemeja Putih" required>
      </div>
      <div>
        <label>Kategori:</label>
        <input type="text" id="kategoriProduk" placeholder="Atasan / Bawahan / Aksesoris" required>
      </div>
      <div>
        <label>Harga (Rp):</label>
        <input type="number" id="hargaProduk" placeholder="Contoh: 150000" required>
      </div>
      <div>
        <label>Jumlah Stok Awal:</label>
        <input type="number" id="stokProduk" placeholder="Contoh: 20" required>
      </div>
      <div>
        <label>Link/URL Gambar:</label>
        <input type="url" id="gambarProduk" placeholder="https://..." required>
      </div>
      <div class="full-width">
        <button type="submit" style="width: 100%; background: #2ecc71;">Simpan Produk ke Database</button>
      </div>
    </form>

    <hr>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Daftar Inventaris</h3>
      <button onclick="muatDaftarProduk()" style="background: #95a5a6;">Muat Ulang Data</button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nama Produk</th>
          <th>Harga</th>
          <th>Stok</th>
          <th style="width: 170px;">Aksi</th>
        </tr>
      </thead>
      <tbody id="tabel-produk-body">
        <tr><td colspan="5" style="text-align: center;">Memuat data dari Google Sheets...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  // URL Web App GAS Anda (SUDAH DIPERBARUI)
  const urlAPI = 'https://script.google.com/macros/s/AKfycbzVUGRXk3b-JEBc86Gu_BZ4oep1CR6dMcISknFtSYrNJCMadYvGenMq-ZJPAlqFa73fLQ/exec';

  // 1. CEK STATUS LOGIN SAAT HALAMAN DIMUAT
  window.onload = function() {
    const savedPin = sessionStorage.getItem('adminPin');
    if (savedPin) {
      tampilkanDashboard();
    }
  };

  // 2. FUNGSI LOGIN
  function prosesLogin(e) {
    e.preventDefault();
    const pin = document.getElementById('input-pin').value;
    sessionStorage.setItem('adminPin', pin); // Simpan PIN di memori browser
    tampilkanDashboard();
  }

  // 3. FUNGSI LOGOUT
  function prosesLogout() {
    sessionStorage.removeItem('adminPin');
    document.getElementById('section-dashboard').classList.add('hidden');
    document.getElementById('section-login').classList.remove('hidden');
    document.getElementById('input-pin').value = '';
  }

  // 4. MASUK KE DASHBOARD & MUAT DATA
  function tampilkanDashboard() {
    document.getElementById('section-login').classList.add('hidden');
    document.getElementById('section-dashboard').classList.remove('hidden');
    muatDaftarProduk();
  }

  // 5. AMBIL DATA DARI SPREADSHEET
  async function muatDaftarProduk() {
    const tbody = document.getElementById('tabel-produk-body');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Sedang menyinkronkan data...</td></tr>';
    
    try {
      const response = await fetch(`${urlAPI}?action=getProduk`);
      const data = await response.json();
      
      let html = '';
      if (data.length === 0) {
        html = '<tr><td colspan="5" style="text-align: center;">Belum ada produk di database.</td></tr>';
      } else {
        data.forEach(item => {
          html += `
            <tr>
              <td><strong>${item.ID_Produk}</strong></td>
              <td>${item.Nama_Produk}<br><small style="color:#7f8c8d;">${item.Kategori}</small></td>
              <td>Rp ${item.Harga.toLocaleString('id-ID')}</td>
              <td><strong>${item.Stok}</strong></td>
              <td>
                <button class="btn-edit" onclick="editStok('${item.ID_Produk}', ${item.Stok})">Edit Stok</button>
                <button class="btn-hapus" onclick="hapusProduk('${item.ID_Produk}')">Hapus</button>
              </td>
            </tr>
          `;
        });
      }
      tbody.innerHTML = html;
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Gagal memuat data. Periksa koneksi internet Anda.</td></tr>';
    }
  }

  // 6. FUNGSI TAMBAH PRODUK
  async function tambahProduk(e) {
    e.preventDefault();
    const pin = sessionStorage.getItem('adminPin');

    const dataPayload = {
      action: "tambahProduk",
      pin: pin,
      id: document.getElementById('idProduk').value,
      nama: document.getElementById('namaProduk').value,
      kategori: document.getElementById('kategoriProduk').value,
      harga: document.getElementById('hargaProduk').value,
      stok: document.getElementById('stokProduk').value,
      gambar: document.getElementById('gambarProduk').value
    };

    // Ubah teks tombol saat loading
    const btnSubmit = e.target.querySelector('button[type="submit"]');
    const originalText = btnSubmit.innerText;
    btnSubmit.innerText = "Menyimpan...";
    btnSubmit.disabled = true;

    try {
      const response = await fetch(urlAPI, {
        method: "POST",
        body: JSON.stringify(dataPayload)
      });
      const hasil = await response.json();
      
      if (hasil.status === "Success") {
        alert("Produk berhasil ditambahkan!");
        document.getElementById('form-tambah-produk').reset(); // Kosongkan form
        muatDaftarProduk(); // Refresh tabel
      } else {
        alert("Gagal: " + hasil.message);
        if (hasil.message.includes("PIN")) prosesLogout(); // Tendang keluar jika PIN salah
      }
    } catch (error) {
      alert("Terjadi kesalahan sistem.");
    } finally {
      btnSubmit.innerText = originalText;
      btnSubmit.disabled = false;
    }
  }

  // 7. FUNGSI EDIT STOK
  async function editStok(idProduk, stokLama) {
    const stokBaru = prompt(`Berapa sisa stok baru untuk produk ${idProduk}?`, stokLama);
    if (stokBaru === null || stokBaru === "") return; // Batal jika kosong

    const pin = sessionStorage.getItem('adminPin');
    const dataPayload = {
      action: "editStok",
      pin: pin,
      id: idProduk,
      stokBaru: parseInt(stokBaru)
    };

    try {
      const response = await fetch(urlAPI, {
        method: "POST",
        body: JSON.stringify(dataPayload)
      });
      const hasil = await response.json();
      
      if (hasil.status === "Success") {
        muatDaftarProduk();
      } else {
        alert("Gagal: " + hasil.message);
        if (hasil.message.includes("PIN")) prosesLogout();
      }
    } catch (error) {
      alert("Terjadi kesalahan jaringan saat update stok.");
    }
  }

  // 8. FUNGSI HAPUS PRODUK
  async function hapusProduk(idProduk) {
    if (!confirm(`PERINGATAN!\nYakin ingin menghapus produk ${idProduk} dari database?`)) return;

    const pin = sessionStorage.getItem('adminPin');
    const dataPayload = {
      action: "hapusProduk",
      pin: pin,
      id: idProduk
    };

    try {
      const response = await fetch(urlAPI, {
        method: "POST",
        body: JSON.stringify(dataPayload)
      });
      const hasil = await response.json();
      
      if (hasil.status === "Success") {
        muatDaftarProduk();
      } else {
        alert("Gagal: " + hasil.message);
        if (hasil.message.includes("PIN")) prosesLogout();
      }
    } catch (error) {
      alert("Terjadi kesalahan jaringan saat menghapus data.");
    }
  }
</script>

</body>
</html>
