<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog DEINSA</title>
  <style>
    /* Styling sederhana agar toko terlihat rapi */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #2C3E50; margin-bottom: 20px; }
    #inputCari { padding: 12px; width: 80%; max-width: 500px; margin-bottom: 30px; border-radius: 25px; border: 1px solid #ccc; font-size: 16px; outline: none; text-align: center; }
    #katalog-busana { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    
    .kartu-produk { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px; text-align: left; transition: transform 0.2s; }
    .kartu-produk:hover { transform: translateY(-5px); }
    .kartu-produk img { max-width: 100%; height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
    .kartu-produk h3 { margin: 0 0 10px 0; font-size: 1.1em; color: #333; }
    .kartu-produk p { margin: 5px 0; color: #666; font-size: 0.9em; }
    .harga { font-weight: bold; color: #E74C3C; font-size: 1.1em; }
    
    .btn-pesan { display: block; width: 100%; padding: 12px; background-color: #25D366; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; margin-top: 15px; font-size: 1em; }
    .btn-pesan:hover { background-color: #128C7E; }
  </style>
</head>
<body>

  <h1>Katalog DEINSA</h1>
  
  <input type="text" id="inputCari" placeholder="Cari nama pakaian atau kategori..." onkeyup="filterKatalog()">

  <div id="katalog-busana">
    <p>Memuat katalog produk...</p>
  </div>

  <script>
    // URL Web App GAS Anda
    const urlAPI = 'https://script.google.com/macros/s/AKfycbzVUGRXk3b-JEBc86Gu_BZ4oep1CR6dMcISknFtSYrNJCMadYvGenMq-ZJPAlqFa73fLQ/exec';
    
    // Nomor WA Admin Sementara
    const NOMOR_WA_ADMIN = "62816847468";
    
    let dataProdukGlobal = []; 

    // Fungsi mengambil data dari Spreadsheet
    async function muatKatalog() {
      try {
        const response = await fetch(`${urlAPI}?action=getProduk`);
        dataProdukGlobal = await response.json();
        tampilkanProduk(dataProdukGlobal);
      } catch (error) {
        document.getElementById('katalog-busana').innerHTML = '<p>Gagal memuat data katalog. Pastikan koneksi internet stabil.</p>';
        console.error("Error Fetching Data:", error);
      }
    }

    // Fungsi mencetak HTML kartu produk
    function tampilkanProduk(data) {
      let htmlKatalog = '';
      
      if (data.length === 0) {
        document.getElementById('katalog-busana').innerHTML = '<p>Produk tidak ditemukan atau stok kosong.</p>';
        return;
      }

      data.forEach(item => {
        htmlKatalog += `
          <div class="kartu-produk">
            <img src="${item.URL_Gambar}" alt="${item.Nama_Produk}" onerror="this.src='https://via.placeholder.com/250x250?text=Gambar+Tidak+Tersedia'">
            <h3>${item.Nama_Produk}</h3>
            <p class="harga">Rp ${item.Harga.toLocaleString('id-ID')}</p>
            <p>Kategori: ${item.Kategori}</p>
            <p>Sisa Stok: ${item.Stok}</p>
            <button class="btn-pesan" onclick="checkoutWA('${item.ID_Produk}')">Beli via WhatsApp</button>
          </div>
        `;
      });
      document.getElementById('katalog-busana').innerHTML = htmlKatalog;
    }

    // Fungsi Filter Pencarian (Tanpa Reload)
    function filterKatalog() {
      const kataKunci = document.getElementById('inputCari').value.toLowerCase();
      
      const hasilFilter = dataProdukGlobal.filter(item => {
        const nama = item.Nama_Produk.toLowerCase();
        const kategori = item.Kategori.toLowerCase();
        return nama.includes(kataKunci) || kategori.includes(kataKunci); 
      });
      
      tampilkanProduk(hasilFilter);
    }

    // Fungsi Checkout ke WhatsApp
    function checkoutWA(idProduk) {
      const produk = dataProdukGlobal.find(item => item.ID_Produk === idProduk);
      
      if (!produk) {
        alert("Produk tidak ditemukan!");
        return;
      }

      const pesan = `Halo Admin DEINSA, saya tertarik dengan produk ini:\n\n` +
                    `*Nama Produk:* ${produk.Nama_Produk}\n` +
                    `*Kode:* ${produk.ID_Produk}\n` +
                    `*Harga:* Rp ${produk.Harga.toLocaleString('id-ID')}\n\n` +
                    `Apakah stoknya masih tersedia untuk dikirim?`;

      const teksEncoded = encodeURIComponent(pesan);
      const linkWA = `https://api.whatsapp.com/send?phone=${NOMOR_WA_ADMIN}&text=${teksEncoded}`;
      
      window.open(linkWA, '_blank');
    }

    // Eksekusi muat katalog saat halaman pertama kali dibuka
    muatKatalog();
  </script>

</body>
</html>
